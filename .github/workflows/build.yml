name: Build EnergyUI (unsigned ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "=== objectVersion check (before) ==="
          grep -m1 "objectVersion" EnergyUI.xcodeproj/project.pbxproj || true
          # Xcode 15.4 不支持 objectVersion 77，确定性降级为 60
          if grep -q "PBXFileSystemSynchronizedRootGroup" EnergyUI.xcodeproj/project.pbxproj; then
            echo "ERROR: project contains Xcode16-only synchronized groups; cannot downgrade"
            exit 1
          fi
          sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' EnergyUI.xcodeproj/project.pbxproj
          echo "=== objectVersion check (after) ==="
          grep -m1 "objectVersion" EnergyUI.xcodeproj/project.pbxproj

      - name: Build (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild -project EnergyUI.xcodeproj \
            -scheme EnergyUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/EnergyUI.app" Payload/
          zip -qry EnergyUI.ipa Payload
          ls -la EnergyUI.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergyUI-ipa
          path: EnergyUI.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
